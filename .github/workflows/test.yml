name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    # 目前只在 macOS 上验证过（截图文字识别用的是 macOS 的 Vision）
    runs-on: macos-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - run: node scripts/leakscan.mjs
